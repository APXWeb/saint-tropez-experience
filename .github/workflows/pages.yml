name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # base: './' no vite.config.js: o mesmo build funciona em /<repo>/ sem variável de ambiente.
      - run: npm run build
      - name: Conferir que todo arquivo referenciado existe
        run: |
          cd dist
          missing=0
          for page in index.html cardapio.html; do
            for f in $(grep -oE '(src|href)="\./[^"]+"' "$page" | sed -E 's/^(src|href)="\.\///; s/"$//' | sort -u); do
              f="${f%%#*}"   # ./#vitrine aponta para a própria página
              [ -z "$f" ] && continue
              [ -f "$f" ] || { echo "faltando em $page: $f"; missing=1; }
            done
            for f in $(grep -oE 'img/[a-z0-9-]+\.(webp|avif|png)' "$page" | sort -u); do
              [ -f "$f" ] || { echo "faltando em $page: $f"; missing=1; }
            done
          done
          exit $missing
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
